<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca — Biblioteca Online</title>
  <link rel="stylesheet" href="../style/busca.css">
  <script src="../script/pageGuard.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <a class="logo" href="telaProfessor.html">
      <span class="logo-mark">Instituto Estadual Riachuelo</span>
      <span class="logo-tag">Biblioteca Online</span>
    </a>
  </header>

  <div class="search-bar-wrap">
    <div class="search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar por título, autor, ISBN ou categoria…" oninput="filterBooks()" />
      </div>
      <button class="btn btn-primary" onclick="filterBooks()">Buscar</button>
    </div>
  </div>

  <div class="page-hero">
    <div>
      <div class="page-title"><span class="page-icon">🔍</span> Catálogo de Livros</div>
      <div class="page-sub">Encontre materiais no acervo da biblioteca</div>
    </div>
    
    <div class="page-hero-actions">
      <button class="btn btn-secondary" type="button" onclick="window.location.href='indexTelaAluno.html'">⬅️ Voltar</button>
      <button id="btnAtualizarBusca" class="btn btn-secondary" type="button">🔄 Atualizar</button>
      <button class="btn btn-secondary btn-sm" onclick="toggleView('lista')">☰ Lista</button>
      <button class="btn btn-secondary btn-sm" onclick="toggleView('grade')">⊞ Grade</button>
    </div>
  </div>

  <main>
    <div class="search-layout">

      <aside class="filters-panel">

        <div class="filter-group">
          <div class="filter-group-title">Categoria</div>
          <div class="filter-options">
            <label class="filter-option"><input type="checkbox" onchange="filterBooks()" value="Literatura Brasileira"> Literatura Brasileira</label>
            <label class="filter-option"><input type="checkbox" onchange="filterBooks()" value="Ficção Científica"> Ficção Científica</label>
            <label class="filter-option"><input type="checkbox" onchange="filterBooks()" value="História"> História</label>
            <label class="filter-option"><input type="checkbox" onchange="filterBooks()" value="Ciências"> Ciências</label>
            <label class="filter-option"><input type="checkbox" onchange="filterBooks()" value="Matemática"> Matemática</label>
            <label class="filter-option"><input type="checkbox" onchange="filterBooks()" value="Poesia"> Poesia</label>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Faixa Etária</div>
          <div class="filter-options">
            <label class="filter-option"><input type="radio" name="faixa" onchange="filterBooks()"> Infantojuvenil</label>
            <label class="filter-option"><input type="radio" name="faixa" onchange="filterBooks()"> Jovem Adulto</label>
            <label class="filter-option"><input type="radio" name="faixa" onchange="filterBooks()"> Adulto</label>
            <label class="filter-option"><input type="radio" name="faixa" onchange="filterBooks()" checked> Todas</label>
          </div>
        </div>

        <button class="btn btn-secondary" style="width:100%;" onclick="clearFilters()">Limpar filtros</button>

      </aside>

      <div class="results-area">
        <div class="results-header">
          <div class="results-count" id="resultsCount">Exibindo <strong>0</strong> livros</div>
          <div class="results-sort">
            Ordenar por:
            <select onchange="sortBooks(this.value)">
              <option value="titulo">Título A–Z</option>
              <option value="autor">Autor</option>
              <option value="recente">Recém adicionados</option>
            </select>
          </div>
        </div>

        <div class="book-list" id="bookList"></div>

        <div class="pagination" id="pagination"></div>
      </div>

    </div>
  </main>
 
  <footer>
    <span>Biblioteca Online — Sistema de Gestão &copy; 2026</span>
    <span>Módulo: Busca</span>
  </footer>

  <script type="module" src="../script/busca.js"></script>

</body>
</html>
