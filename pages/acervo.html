<!DOCTYPE html>
<html lang="pt-BR">

<head> 
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Online — Acervo</title>
  
  <link rel="stylesheet" href="../style/addLivros.css">
  <script src="../script/pageGuard.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <div class="logo">
      <span class="logo-mark">Instituto Estadual Riachuelo</span>
      <span class="logo-tag">Biblioteca Online</span>
    </div>
    <span class="header-meta">Versão 1.0</span>
  </header>

  <div class="page active" id="page-acervo">

    <div class="hero">
      <h1>Acervo<br><span>Literário</span></h1>
      <p class="hero-desc">
        Explore o catálogo completo da biblioteca. Pesquise por título, autor ou categoria.
      </p>
    </div>

    <div class="stats" id="stats-bar">
      <div class="stat">
        <!-- <span class="stat-num" id="stat-total">0</span> -->
        <!-- <span class="stat-label">Títulos</span> -->
      </div>
    </div>

    <main>
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input class="search-input" id="search-input" type="search" placeholder="Buscar por título ou autor...">
          </div>

          <select class="filter-select" id="filter-categoria">
            <option value="">Todas as categorias</option>
            <option value="Literatura">Literatura</option>
            <option value="Ciências">Ciências</option>
            <option value="História">História</option>
            <option value="Matemática">Matemática</option>
            <option value="Filosofia">Filosofia</option>
            <option value="Artes">Artes</option>
          </select>
        </div>

        <div class="toolbar-right">
          <div class="view-toggle">
            <button class="view-btn active" id="btn-grid" onclick="setView('grid')" title="Grade">⊞</button>
            <button class="view-btn" id="btn-list" onclick="setView('list')" title="Lista">☰</button>
          </div>

          <button id="btnVoltar" class="btn-secondary" type="button" onclick="window.location.href='indexTelaAluno.html'">
            ⬅️ Voltar
          </button>

          <button id="btnAtualizarAcervo" class="btn-secondary" type="button">
            🔄 Atualizar
          </button>

          <button onclick="window.location.href='addLivros.html'" class="btn-primary">
            ＋ Importar Livro
          </button>
        </div>
      </div>

      <div class="books-grid" id="books-grid"></div>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Detalhes do livro</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="../script/acervo.js"></script>
</body>
</html>
